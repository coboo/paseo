[project]
name = "paseo-quant"
version = "0.1.0"
description = "指数/ETF 量化系统——数据模块"
requires-python = ">=3.12,<3.13"
dependencies = [
    "akshare>=1.15",
    "bt>=1.2.0",
    "pandas>=2.2",
    "plotly>=6.9.0",
    "pyarrow>=15",
    "quantstats>=0.0.81",
    "streamlit>=1.59.1",
    "vectorbt>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_module", "src/metrics", "src/strategy"]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
]
